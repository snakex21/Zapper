name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build release package
        shell: powershell
        run: .\release.ps1 -Tag "${{ github.ref_name }}"

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/Zapper-$env:GITHUB_REF_NAME-Windows-x64.zip" `
            "dist/Zapper-$env:GITHUB_REF_NAME-Windows-x64.zip.sha256" `
            --title "Zapper $env:GITHUB_REF_NAME" `
            --generate-notes
